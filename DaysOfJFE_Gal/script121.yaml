# 角色定义
characters:
  我:
    id: "A1"
    base_pos: "right"
    offset: [-50, 0]
  ABC:
    id: "A3"
    base_pos: "right"
    offset: [-30, -20]
  白百璃:
    id: "G1"
    base_pos: "left"
    offset: [50, 0]
    sprites:
      normal: "src/image/character/寄り道しちゃう？_84040068.png"
  教官:
    id: "B6"
    base_pos: "left"
    offset: [30, -10]
  室友RRR:
    id: "A3"
    base_pos: "right"
    offset: [-30, -20]
  校医:
    id: "B7"
    base_pos: "left"
    offset: [30, -10]
  陈学姐:
    id: "B8"
    base_pos: "right"
    offset: [-30, -20]
  领导:
    id: "B9"
    base_pos: "center"
    offset: [0, -30]
  秋雨样大人:
    id: "B10"
    base_pos: "right"
    sprites:
      normal: "src/image/character/秋雨样.png"
  社团招新员:
    id: "B11"
  凉宫春日:
    id: "S1"
    sprites:
      normal: "src/image/character/涼宮ハルヒ_110906004.png"
  唐可可:
    id: "S2"
    sprites:
      normal: "src/image/character/クゥクゥちゃん_91289326.png"

# 章节数据
chapter:
  title: "Re:从零开始的JFE生活"
  scenes:
    - scene_id: 1
      background: "src/image/background/风景-3.jpg"
      characters:
        - name: "我"
        - name: "白百璃"
          sprite: "normal"
          offset: [50, 0]
      dialogues:
        - type: "dialogue"
          speaker: "A1"
          text: "这里就是...JFE吗..."

        - type: "narration"
          text: "阳光透过树叶的缝隙洒在校门上，地图显示这里是麦庐校区南门。虽然位置有点偏僻，但意外地有种与世隔绝的学园感呢～"

        - type: "narration"
          text: "从今天开始的四年时光，就要在这个地方度过了..."

        - type: "narration"
          text: "（明明高考前还在补番的说...现在却真的站在大学门口了）"

        - type: "dialogue"
          speaker: "A1"
          text: "先去报到吧...希望不要迷路才好..."

        - type: "command"
          cmd: "bg"
          action: "title"
          param: "Re:从零开始的JFE生活"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/教学楼-外-1.jpg"

        - type: "narration"
          text: "跟着指示牌走着走着，突然看到写着『计算机与人工智能学院』的帐篷。这就是我的学院了，听说还是今年新成立的"

        - type: "dialogue"
          speaker: "A1"
          text: "那个...请问网安专业是在这里报到吗？"

        - type: "dialogue"
          speaker: "B1"
          text: "是的哦～请在这份名单上找到你的名字签字～"

        - type: "dialogue"
          speaker: "B"
          text: "这是新生小礼物～祝你在JFE生活愉快！"

        - type: "dialogue"
          speaker: "A1"
          text: "非常感谢！"

        - type: "narration"
          text: "......"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/宿舍-外-2.jpg"

        - type: "narration"
          text: "宿舍楼前站着几位看起来很亲切的学长，其中一位看到我拖着行李箱，立刻小跑过来"

        - type: "dialogue"
          speaker: "B2"
          text: "新生～需要帮忙吗？"

        - type: "dialogue"
          speaker: "A1"
          text: "啊...那就麻烦学长了..."

        - type: "narration"
          text: "学长轻松提起我觉得超重的行李箱...这就是大学生和高中生的体力差距吗？"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/宿舍-内-1.jpg"

        - type: "dialogue"
          speaker: "B2"
          text: "宿舍在几楼呢？"

        - type: "dialogue"
          speaker: "A1"
          text: "5楼...XXX室..."

        - type: "dialogue"
          speaker: "B2"
          text: "虽然楼层高了些，但采光超～级好哦！而且不容易受潮呢～"

        - type: "narration"
          text: "......"

        - type: "dialogue"
          speaker: "B2"
          text: "到啦～祝你在JFE有个美好的开始！"

        - type: "narration"
          text: "推开宿舍门的瞬间...唔...这是什么神秘气味..."

        - type: "dialogue"
          speaker: "A1"
          text: "这设计...两铺床共用一个梯子也太..."

        - type: "narration"
          text: "正当我对着谜之厕所气味发愁时，后背突然被轻轻拍了一下"

        - type: "dialogue"
          speaker: "A3"
          text: "呀吼～你就是TTT同学吧？"

        - type: "dialogue"
          speaker: "A1"
          text: "是、是的！请问你是...？"

        - type: "dialogue"
          speaker: "A3"
          text: "我是RRR～从今天开始就是室友啦！请多指教～"

        - type: "narration"
          text: "看起来是个性格开朗的人呢...稍微放心了一点..."

        - type: "narration"
          text: "......"

        - type: "dialogue"
          speaker: "A4"
          text: "我是UUU～请多关照desu！"

        - type: "dialogue"
          speaker: "KKK"
          text: "我是KKK～よろしく！"

        - type: "narration"
          text: "大家很快就聊开了...从家乡特产聊到动漫游戏...意外的合拍呢～"

        - type: "narration"
          text: "......"

        - type: "narration"
          text: "稍微收拾后，我前往商业街去购买些生活用品"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/商业街-1.jpg"

        - type: "narration"
          text: "商业街比想象中要热闹呢～雪王奶茶、黑猫杂货...啊咧？居然没有老爷爷炸鸡吗..."

        - type: "narration"
          text: "正在挑选洗漱用品时，突然听到一个熟悉的声音——"

        - type: "dialogue"
          speaker: "G1"
          text: "啊啦～这不是TTQ吗？"

        - type: "narration"
          text: "转身看到的是...从小学开始就同班的青梅竹马——白百璃"

        - type: "narration"
          text: "（居然连大学都...同一个专业什么的...这也太巧了吧...）"

        - type: "dialogue"
          speaker: "A1"
          text: "好、好巧啊...百璃"

        - type: "dialogue"
          speaker: "G1"
          text: "えへへ～宿舍怎么样？我的室友们都超～可爱的说～"

        - type: "dialogue"
          speaker: "A1"
          text: "那个...明天开始军训...记得做好防晒..."

        - type: "narration"
          text: "百璃突然噗嗤一声笑了出来"

        - type: "dialogue"
          speaker: "G1"
          text: "ふふん～你以为我是谁呀？防晒霜当然会涂得满满的啦～"

        - type: "narration"
          text: "她把'满'字拖得长长的...这种时候总是拿她没办法..."

        - type: "dialogue"
          speaker: "G1"
          text: "TTQ也要好好用防晒霜哦～那可是我精心挑选的！用完了随时告诉我～"

        - type: "narration"
          text: "（糟糕...完全忘记防晒霜是她选的了...我在说什么啊...）"

        - type: "dialogue"
          speaker: "G1"
          text: "我还有事要先走啦～晚上视频见！"

        - type: "dialogue"
          speaker: "A1"
          text: "嗯...路上小心..."

        - type: "command"
          cmd: "character"
          action: "hide"
          param: "G1"

        - type: "narration"
          text: "看着她离去的背影...我不自觉地叹了口气..."

        - type: "narration"
          text: "......"

        - type: "narration"
          text: "晚餐时间决定去食堂看看...虽然商业街选择很多，但果然还是想先尝尝食堂的味道呢～"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/食堂-外-1.jpg"

        - type: "narration"
          text: "二食堂的灯光暖暖的...意外的很有氛围呢..."

        - type: "dialogue"
          speaker: "A1"
          text: "阿姨...请给我蒸蛋和火腿肠炒玉米..."

        - type: "narration"
          text: "找了个靠窗的位置坐下...饭菜的味道...嗯...普通的好吃程度..."

        - type: "narration"
          text: "突然手机震动起来...是家庭群聊的视频通话..."

        - type: "dialogue"
          speaker: "妈"
          text: "儿子～大学生活怎么样呀？"

        - type: "dialogue"
          speaker: "A1"
          text: "才第一天啦...不过宿舍床铺设计有点微妙就是了..."

        - type: "dialogue"
          speaker: "妈"
          text: "大学可是人生重要阶段！四六级要早点准备..."

        - type: "narration"
          text: "（这套说辞从小学听到现在都没变过呢...）"

        - type: "narration"
          text: "表姐突然加入了聊天..."

        - type: "dialogue"
          speaker: "表姐"
          text: "哇～食堂变这么亮了？我们那时候可没这么豪华～"

        - type: "dialogue"
          speaker: "A1"
          text: "不过宿舍好像还是老样子..."

        - type: "dialogue"
          speaker: "表姐"
          text: "啊～那个逆天床铺！我懂我懂！上铺一动下铺就地震对吧～"

        - type: "narration"
          text: "聊着聊着...妈妈突然问道..."

        - type: "dialogue"
          speaker: "妈"
          text: "对了...怎么没看到百璃呀？"

        - type: "dialogue"
          speaker: "A1"
          text: "她说...晚上再视频..."

        - type: "narration"
          text: "视频通话结束后，食堂的灯光已经渐渐暗了下来。窗外的天空染上了橘红色，校园里的路灯一盏接一盏亮起，像是为夜归人点亮的指引。"

        - type: "dialogue"
          speaker: "A1"
          text: "哈啊...第一天就这么结束了呢..."

        - type: "narration"
          text: "收拾好餐盘准备离开时，手机突然震动起来。屏幕上显示着『百璃』两个字，还配着她上次强行设置的可爱猫咪来电图片。"

        - type: "dialogue"
          speaker: "G1"
          text: "莫西莫西～TTQ现在在哪里呀？"

        - type: "dialogue"
          speaker: "A1"
          text: "刚、刚吃完晚饭，还在二食堂..."

        - type: "dialogue"
          speaker: "G1"
          text: "太好了！我正好在商业街买奶茶，你要不要也来一杯？作为今天提醒我防晒的回礼～"

        - type: "narration"
          text: "电话那头传来吸管插入奶茶杯的清脆声响，还有百璃满足的叹息声。光是听着就让人想象出她眯着眼睛的幸福表情。"

        - type: "dialogue"
          speaker: "A1"
          text: "那...我要珍珠奶茶，少糖..."

        - type: "dialogue"
          speaker: "G1"
          text: "はいはい～知道了啦！老样子嘛。对了对了，商业街这边超～热闹的，好像有什么新生欢迎活动！"

        - type: "narration"
          text: "背景音里突然传来一阵欢呼声，还有吉他弹唱的声音。这么晚了还有活动...大学生活果然和高中不一样呢。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/商业街-1.jpg"

        - type: "dialogue"
          speaker: "G1"
          text: "这边这边～"

        - type: "narration"
          text: "循着声音望去，百璃正站在奶茶店门口朝我挥手。她今天扎了高马尾，在夜风中轻轻摇晃，手里还提着两杯奶茶。"

        - type: "dialogue"
          speaker: "G1"
          text: "给～你的少糖珍珠奶茶。我尝试了新品樱花奶盖，超好喝的！要尝尝看吗？"

        - type: "narration"
          text: "她突然把吸管凑到我面前，粉色的奶盖上还点缀着几片樱花形状的糖片。这个距离...间接kiss什么的..."

        - type: "dialogue"
          speaker: "A1"
          text: "不、不用了！我喝自己的就好..."

        - type: "dialogue"
          speaker: "G1"
          text: "诶～好可惜。那我们去逛逛吧，听说今晚有好多摊位呢！"

        - type: "narration"
          text: "被她拉着袖子穿梭在人群中，各种声音混杂在一起。街边的小摊摆满了各种小玩意儿，暖黄的灯光把整条街照得温馨明亮。"

        - type: "narration"
          text: "百璃在一个饰品摊前停下脚步，拿起一对星空主题的金属书签。星星和月亮的图案在灯光下闪烁着细碎的光芒。"

        - type: "dialogue"
          speaker: "G1"
          text: "好漂亮...TTQ你看，星星和月亮的图案是一对的！"

        - type: "narration"
          text: "她不由分说地买下那对书签，把星星图案的塞进我手里，自己留下了月亮图案。"

        - type: "dialogue"
          speaker: "G1"
          text: "这个给你～就当是...今天一起逛的纪念吧。"

        - type: "narration"
          text: "书签还带着她掌心的温度，我还没来得及道谢，她就已经转身向前走去了。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/风景-2.jpg"

        - type: "narration"
          text: "逛完街边的摊位后，我们不知不觉走到了学校边缘的小树林。夜风吹拂树叶发出沙沙声响，路灯的光晕在地上画出一个个光圈，百璃的马尾辫在光影间跳跃。"

        - type: "dialogue"
          speaker: "G1"
          text: "快看！那边有萤火虫！"

        - type: "narration"
          text: "她突然停下脚步，指着树丛间闪烁的微光。在都市里很少能见到这样自然的景象..."

        - type: "dialogue"
          speaker: "A1"
          text: "真的...好漂亮..."

        - type: "narration"
          text: "转头看向百璃时，发现她正用手机对着我。咔嚓一声——"

        - type: "dialogue"
          speaker: "G1"
          text: "抓到啦！TTQ难得的感动表情～"

        - type: "dialogue"
          speaker: "A1"
          text: "等等...别拍..."

        - type: "narration"
          text: "继续往前走，发现了天文社临时搭建的观星台。百璃踮起脚尖凑近望远镜，发丝间传来淡淡的洗发水香气。"

        - type: "dialogue"
          speaker: "G1"
          text: "北斗七星好清楚...小时候我们也在院子里找过呢。"

        - type: "dialogue"
          speaker: "A1"
          text: "嗯...那时候你还把北极星认错了。"

        - type: "dialogue"
          speaker: "G1"
          text: "啊！你还记得那种事！都说了那时候太小了啦！"

        - type: "narration"
          text: "她鼓着脸颊的样子让人忍不住想笑。透过望远镜看到的星空比想象中还要璀璨，而她在旁边小声哼着歌，让人心跳不由自主地加快..."

        - type: "narration"
          text: "回宿舍的路上，百璃突然停下脚步，指着天空——"

        - type: "dialogue"
          speaker: "G1"
          text: "快看！流星！"

        - type: "narration"
          text: "抬头望去，一道银线划过夜空。还没来得及许愿，就听见百璃小声说道..."

        - type: "dialogue"
          speaker: "G1"
          text: "希望这四年...也能一直和TTQ在一起..."

        - type: "narration"
          text: "这句话轻得几乎要被夜风吹散，但我确实听到了。心脏像是被什么温暖的东西填满，手中的星空书签似乎也变得滚烫起来..."

        - type: "narration"
          text: "（这就是...大学生活的开始啊...）"

        - type: "command"
          cmd: "bg"
          action: "title"
          param: "本章终"

        - type: "command"
          cmd: "chapter"
          action: "drop"
          param: "2"

    - scene_id: 2
      background: "src/image/background/宿舍-内-1.jpg"
      characters:
        - name: "我"
        - name: "白百璃"
          sprite: "normal"
      dialogues:
        - type: "command"
          cmd: "bg"
          action: "title"
          param: "第二章"

        - type: "narration"
          text: "清晨六点的闹钟刺破梦境，窗外还笼罩在朦胧的晨光中。今天是军训第一天..."

        - type: "dialogue"
          speaker: "A1"
          text: "呜...这么早..."

        - type: "narration"
          text: "迷迷糊糊摸到手机，发现百璃五分钟前已经发来了消息——"

        - type: "dialogue"
          speaker: "G1"
          text: "记得涂防晒霜！我在楼下等你～"

        - type: "narration"
          text: "附带一张对着镜子涂防晒霜的自拍，她穿着迷彩服的样子有种新鲜的感觉。"

        - type: "dialogue"
          speaker: "A3"
          text: "哟～女朋友？"

        - type: "narration"
          text: "室友从被窝里探出头，打着哈欠瞥了眼我的屏幕。"

        - type: "dialogue"
          speaker: "A1"
          text: "不是...只是从小认识的朋友。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/宿舍-外-4.jpg"

        - type: "narration"
          text: "匆匆赶到楼下时，百璃正蹲在花坛边喂流浪猫。阳光透过树叶在她身上投下斑驳的光影。"

        - type: "dialogue"
          speaker: "G1"
          text: "太慢了啦～诶？你该不会忘记涂防晒了吧？"

        - type: "narration"
          text: "她突然凑近盯着我的脸看。"

        - type: "dialogue"
          speaker: "A1"
          text: "涂、涂了！"

        - type: "dialogue"
          speaker: "G1"
          text: "骗人～耳朵后面都没涂到。真是的...闭上眼睛。"

        - type: "narration"
          text: "还没反应过来，清凉的防晒霜就抹上了耳后。"

        - type: "dialogue"
          speaker: "G1"
          text: "好啦～这样就不会晒伤了。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/操场-内-2.jpg"

        - type: "narration"
          text: "操场上已经列好方阵，穿着统一迷彩服的新生们站得满满当当。"

        - type: "dialogue"
          speaker: "B6"
          text: "立——正！"

        - type: "narration"
          text: "教官洪亮的声音让全场安静下来。"

        - type: "dialogue"
          speaker: "B6"
          text: "军姿训练，现在开始。"

        - type: "narration"
          text: "九月的太阳炙烤着操场。汗水顺着额头滑进眼睛，有点刺痛。"

        - type: "narration"
          text: "余光瞥见女生方阵里的百璃，她挺直腰板的样子格外认真，发梢闪着汗水的光泽。"

        - type: "dialogue"
          speaker: "B6"
          text: "那个男生！手臂贴紧裤缝！"

        - type: "narration"
          text: "教官的声音让我一激灵。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/操场-内-1.jpg"

        - type: "narration"
          text: "休息时分，我和室友们瘫倒在树荫下。迷彩服后背都湿透了。"

        - type: "dialogue"
          speaker: "A3"
          text: "要命...这军训真够受的..."

        - type: "dialogue"
          speaker: "KKK"
          text: "下午还有...让我再躺会儿..."

        - type: "narration"
          text: "一瓶冰镇矿泉水突然贴到我脸上——"

        - type: "dialogue"
          speaker: "G1"
          text: "补给送达～"

        - type: "narration"
          text: "百璃抱着几瓶水站在面前，她的迷彩服袖口卷到手肘，露出晒得微微发红的手臂。"

        - type: "dialogue"
          speaker: "A3"
          text: "哦哦！谢谢百璃同学！"

        - type: "narration"
          text: "她冲室友笑了笑，然后凑近我，往我手里塞了什么东西。"

        - type: "dialogue"
          speaker: "A1"
          text: "这是...？"

        - type: "dialogue"
          speaker: "G1"
          text: "护膝。下午匍匐前进肯定会磨膝盖...给你用。"

        - type: "narration"
          text: "她说话时眼神飘向别处。"

        - type: "dialogue"
          speaker: "A1"
          text: "那你呢？"

        - type: "dialogue"
          speaker: "G1"
          text: "我当然也有啦～"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/操场-内-3.jpg"

        - type: "narration"
          text: "下午的训练场尘土飞扬。低姿匍匐时，手肘磨得有点疼，不过有护膝确实好受不少。"

        - type: "dialogue"
          speaker: "B6"
          text: "动作快点！"

        - type: "narration"
          text: "教官的喊声在训练场上回荡。我偷偷瞥了一眼女生方阵，百璃正趁着教官转身的空档朝我比了个手势。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/风景-4.jpg"

        - type: "narration"
          text: "黄昏时分，训练终于结束。我拖着酸痛的腿往宿舍走，半路遇到了同样疲惫的百璃。"

        - type: "dialogue"
          speaker: "G1"
          text: "TTQ～今天辛苦啦！护膝好用吗？"

        - type: "dialogue"
          speaker: "A1"
          text: "嗯...帮大忙了。"

        - type: "dialogue"
          speaker: "G1"
          text: "えへへ～那就好。"

        - type: "narration"
          text: "她伸了个懒腰，马尾辫在夕阳里轻轻晃动。"

        - type: "dialogue"
          speaker: "G1"
          text: "好饿...去食堂吗？"

        - type: "dialogue"
          speaker: "A1"
          text: "走。"

        - type: "narration"
          text: "去食堂的路上，她突然轻声哼起小时候经常一起唱的歌谣。晚风把旋律吹散在暮色里，让人莫名觉得安心。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/宿舍-外-3-NIGHT.jpg"

        - type: "narration"
          text: "吃完饭送她到宿舍楼下时，天已经全黑了。"

        - type: "dialogue"
          speaker: "G1"
          text: "明天见～"

        - type: "dialogue"
          speaker: "A1"
          text: "嗯。早点休息。"

        - type: "narration"
          text: "她转身跑进宿舍楼，马尾辫在灯光下一跳一跳的。"

        - type: "narration"
          text: "回到宿舍，室友们已经累得瘫在床上刷手机了。"

        - type: "narration"
          text: "洗漱完躺在床上，发现百璃更新了动态——"

        - type: "dialogue"
          speaker: "G1"
          text: "军训第一天结束！虽然好累但是超充实(◍•ᴗ•◍)❤"

        - type: "narration"
          text: "配图是夕阳下的操场。我点了个赞，放下手机。"

        - type: "narration"
          text: "耳边似乎还回响着黄昏时她哼的那首歌谣。闭上眼睛，军训第一天的疲惫很快把我拉进了梦乡。"

        - type: "command"
          cmd: "chapter"
          action: "drop"
          param: "3"

    - scene_id: 3
      background: "src/image/background/操场-内-3.jpg"
      characters:
        - name: "我"
        - name: "白百璃"
          sprite: "normal"
      dialogues:
        - type: "command"
          cmd: "bg"
          action: "title"
          param: "第三章"

        - type: "narration"
          text: "军训第二天，太阳还是那么毒。不过有了昨天的经验，今天至少知道该怎么站得省力一点了。"

        - type: "narration"
          text: "上午的队列训练结束后，教官吹响了休息哨。"

        - type: "dialogue"
          speaker: "B6"
          text: "全体都有！原地休息十五分钟！"

        - type: "narration"
          text: "我和室友们照例瘫在树荫下，迷彩服湿了干、干了又湿。"

        - type: "dialogue"
          speaker: "A3"
          text: "昨天那护膝真有用，今天膝盖没那么疼了..."

        - type: "dialogue"
          speaker: "KKK"
          text: "百璃同学人真好啊。"

        - type: "narration"
          text: "正说着，一瓶冰水又贴到了我脸上。"

        - type: "dialogue"
          speaker: "G1"
          text: "今天也补给送达～"

        - type: "narration"
          text: "百璃在我旁边坐下，她的脸晒得有点红，但看起来精神不错。"

        - type: "dialogue"
          speaker: "A1"
          text: "你不休息吗？老跑来跑去的。"

        - type: "dialogue"
          speaker: "G1"
          text: "えへへ～反正闲着也是闲着。"

        - type: "narration"
          text: "她拧开自己那瓶水喝了一口，然后望向操场上还在训练的方阵。"

        - type: "dialogue"
          speaker: "G1"
          text: "下午好像是最后一天训练了，明天就要汇演了吧？"

        - type: "dialogue"
          speaker: "A1"
          text: "嗯。终于要结束了。"

        - type: "dialogue"
          speaker: "G1"
          text: "汇演完了要不要去商业街？听说有家新开的甜品店～"

        - type: "dialogue"
          speaker: "A1"
          text: "好啊。"

        - type: "narration"
          text: "她笑了笑，把水瓶贴在额头上降温。阳光透过树叶洒在她身上，马尾辫在微风里轻轻晃动。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/操场-内-3.jpg"

        - type: "narration"
          text: "下午的训练果然没那么紧张了，教官甚至开始教我们唱军歌。"

        - type: "dialogue"
          speaker: "B6"
          text: "都给我大声唱！跑调没关系，气势要到！"

        - type: "narration"
          text: "整个操场此起彼伏的歌声，虽然完全不在调上，但意外的挺有意思。"

        - type: "narration"
          text: "我偷偷瞥了一眼女生方阵，百璃正张嘴跟着唱，看起来还挺认真的。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/风景-4.jpg"

        - type: "narration"
          text: "黄昏时分，训练结束。我拖着酸痛的腿往宿舍走，在路口遇到了百璃。"

        - type: "dialogue"
          speaker: "G1"
          text: "TTQ～今天也辛苦啦！"

        - type: "dialogue"
          speaker: "A1"
          text: "你也是。膝盖还好吗？"

        - type: "dialogue"
          speaker: "G1"
          text: "没事啦，有护膝呢。倒是你，有没有好好用我给的？"

        - type: "dialogue"
          speaker: "A1"
          text: "用了用了。"

        - type: "narration"
          text: "她满意地点点头，然后伸了个懒腰。"

        - type: "dialogue"
          speaker: "G1"
          text: "明天汇演结束就能解脱了～到时候一起去吃甜品！"

        - type: "dialogue"
          speaker: "A1"
          text: "嗯。你先回去休息吧。"

        - type: "dialogue"
          speaker: "G1"
          text: "TTQ也是～明天见！"

        - type: "narration"
          text: "她挥挥手，转身朝女生宿舍走去。马尾辫在夕阳里一晃一晃的。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/宿舍-外-3-NIGHT.jpg"

        - type: "narration"
          text: "晚上洗完澡躺到床上，发现百璃又更新了动态——"

        - type: "dialogue"
          speaker: "G1"
          text: "军训第二天！明天就是最后一天啦，加油加油(ง •̀_•́)ง"

        - type: "narration"
          text: "配图是夕阳下的操场，还有一瓶喝了一半的矿泉水。"

        - type: "narration"
          text: "我点了个赞，把手机放到枕头边。闭上眼睛，耳边似乎还能听到下午那些跑调的军歌声，还有百璃说甜品店时发亮的眼睛。"

        - type: "narration"
          text: "明天...汇演结束后，去吃点什么好呢。"

        - type: "narration"
          text: "带着这个念头，我在军训第二天的疲惫中沉入梦乡。"

        - type: "command"
          cmd: "chapter"
          action: "drop"
          param: "4"

    - scene_id: 4
      background: "src/image/background/操场-内-3.jpg"
      characters:
        - name: "我"
        - name: "白百璃"
          sprite: "normal"
      dialogues:
        - type: "command"
          cmd: "bg"
          action: "title"
          param: "第四章"

        - type: "narration"
          text: "军训汇演在上午就结束了。走完方阵、喊完口号，整个人都松了下来。"

        - type: "narration"
          text: "下午是开学典礼，操场上重新列好队，主席台上摆了一排话筒。"

        - type: "narration"
          text: "九月的太阳还是毒，迷彩服闷得人直冒汗。"

        - type: "dialogue"
          speaker: "B9"
          text: "同学们，欢迎来到JFE..."

        - type: "narration"
          text: "领导的声音通过音响传遍操场。前排还坐得住，后排已经开始有人偷偷刷手机了。"

        - type: "dialogue"
          speaker: "A3"
          text: "（小声）这要开到什么时候..."

        - type: "narration"
          text: "室友在旁边打哈欠。我偷偷看向女生方阵，百璃正用手扇风，注意到我的视线后做了个鬼脸。"

        - type: "narration"
          text: "也不知道过了多久，领导终于说到了那一句——"

        - type: "dialogue"
          speaker: "B9"
          text: "...那么，开学典礼到此结束。"

        - type: "narration"
          text: "操场瞬间活了过来。大家站起来伸懒腰的伸懒腰，揉腿的揉腿。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/风景-4.jpg"

        - type: "narration"
          text: "散场时我在人群里看到了百璃，她正踮着脚尖朝我这边张望。"

        - type: "dialogue"
          speaker: "G1"
          text: "TTQ！这边这边～"

        - type: "narration"
          text: "她挥手的样子像是怕我看不到似的，马尾辫一甩一甩的。"

        - type: "dialogue"
          speaker: "A1"
          text: "看到了看到了。你嗓子不哑吗，刚才喊口号那么大声。"

        - type: "dialogue"
          speaker: "G1"
          text: "えへへ～有点。不过总算是结束了！"

        - type: "narration"
          text: "她伸了个大懒腰，然后突然想起什么似的。"

        - type: "dialogue"
          speaker: "G1"
          text: "对了！之前说的甜品店，现在去？"

        - type: "dialogue"
          speaker: "A1"
          text: "你不先换衣服？"

        - type: "dialogue"
          speaker: "G1"
          text: "回宿舍换太远了...就这样去啦！反正大家都穿迷彩服。"

        - type: "narration"
          text: "她说得理直气壮，已经迈开步子往商业街方向走了。我只好跟上。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/商业街-1.jpg"

        - type: "narration"
          text: "甜品店开在商业街拐角，不大的店面里飘着甜腻的奶油香。百璃趴在玻璃柜前挑了半天，最后选了个草莓蛋糕。"

        - type: "dialogue"
          speaker: "G1"
          text: "你呢你呢？这个抹茶千层看起来也不错！"

        - type: "dialogue"
          speaker: "A1"
          text: "那我就要那个。"

        - type: "narration"
          text: "找了个靠窗的位置坐下，空调刚好吹到这边。百璃挖了一勺蛋糕送进嘴里，眼睛立刻眯成一条缝。"

        - type: "dialogue"
          speaker: "G1"
          text: "好吃！军训结束就该犒劳自己～"

        - type: "narration"
          text: "她嘴角沾了点奶油，自己完全没注意到。"

        - type: "dialogue"
          speaker: "A1"
          text: "嘴角..."

        - type: "dialogue"
          speaker: "G1"
          text: "诶？"

        - type: "narration"
          text: "她拿纸巾擦了擦，然后突然笑起来。"

        - type: "dialogue"
          speaker: "G1"
          text: "以前春游的时候你也是，吃冰淇淋糊一脸还让我帮你擦。"

        - type: "dialogue"
          speaker: "A1"
          text: "那都是多久以前的事了..."

        - type: "narration"
          text: "窗外阳光正好，商业街上三三两两都是刚散场的新生。她挖着蛋糕，有一搭没一搭地聊着——室友怎么怎么样，教官其实人还不错，还有明天终于可以睡到自然醒。"

        - type: "narration"
          text: "没什么特别的话题，但这样的午后让人觉得很舒服。"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/宿舍-外-3-NIGHT.jpg"

        - type: "narration"
          text: "吃完东西送她到宿舍楼下，天已经擦黑了。"

        - type: "dialogue"
          speaker: "G1"
          text: "今天好开心～军训结束，蛋糕也好吃。"

        - type: "dialogue"
          speaker: "A1"
          text: "嗯。回去早点洗澡休息。"

        - type: "dialogue"
          speaker: "G1"
          text: "知道啦～TTQ也是。"

        - type: "narration"
          text: "她转身往宿舍楼跑了几步，忽然回过头来。"

        - type: "dialogue"
          speaker: "G1"
          text: "对了，后天社团招新，一起去看看吧？"

        - type: "dialogue"
          speaker: "A1"
          text: "好啊。"

        - type: "dialogue"
          speaker: "G1"
          text: "那就这么约好啦！おやすみ～"

        - type: "narration"
          text: "她挥挥手跑进楼里。晚风吹过来，带着初秋的凉意。蝉鸣比盛夏时弱了不少，大概是夏天真的要结束了。"

        - type: "narration"
          text: "回到宿舍，室友正躺在床上刷手机。看到我进来，抬了抬眼皮。"

        - type: "dialogue"
          speaker: "A3"
          text: "哟，回来啦。开学典礼溜那么快。"

        - type: "dialogue"
          speaker: "A1"
          text: "你不也走得挺快。"

        - type: "narration"
          text: "他去翻百璃的动态，对着屏幕啧啧两声。"

        - type: "dialogue"
          speaker: "A3"
          text: "又发了。你家青梅竹马真喜欢发动态啊。"

        - type: "narration"
          text: "我凑过去看了眼——"

        - type: "dialogue"
          speaker: "G1"
          text: "军训圆满结束！开完典礼来吃蛋糕，幸福(◍•ᴗ•◍)❤"

        - type: "narration"
          text: "配图是刚才的草莓蛋糕，角落里能看见我拿着叉子的手。"

        - type: "narration"
          text: "我放下手机，躺回床上。闭上眼睛，脑海里浮现的是她在甜品店里眯眼笑的样子，还有那句 '就这么约好啦'。"

        - type: "narration"
          text: "明天休息一天，后天...和她一起去社团招新吧。"

        - type: "narration"
          text: "不知不觉就睡着了。"

        - type: "command"
          cmd: "chapter"
          action: "drop"
          param: "5"

    - scene_id: 5
      background: "src/image/background/风景-4.jpg"
      characters:
        - name: "我"
        - name: "白百璃"
          sprite: "normal"
        - name: "秋雨样大人"
          sprite: "normal"
        - name: "凉宫春日"
          sprite: "normal"
        - name: "唐可可"
          sprite: "normal"
      dialogues:
        - type: "narration"
          text: "十月，社团招新季。‘百团大战’——这名字听着夸张，但实际场面更夸张。"

        - type: "narration"
          text: "广场上挤满了摊位，音乐社的吉他声、舞蹈团的音乐、闲着没事干开始叫卖式的招新……吵得像是要把新生们直接瓜分干净。"

        - type: "dialogue"
          speaker: "G1"
          text: "原来我们学校有这么多社团的啊"

        - type: "narration"
          text: "百璃拽着我的手腕在人群中穿梭，她的发梢扫过我的脸颊，带着淡淡的柑橘洗发水香气..."

        - type: "command"
          cmd: "bg"
          action: "title"
          param: "第五章：这个网安协会大有问题（一）"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/教学楼-外-1.jpg"

        - type: "narration"
          text: "文学社摊位前，身着汉服的学姐正挥毫泼墨，墨香混着桂花香在秋风中飘散..."

        - type: "dialogue"
          speaker: "B11"
          text: "同学对轻小说创作感兴趣吗？我们每周都有..."

        - type: "dialogue"
          speaker: "G1"
          text: "快听！吉他协会的学姐在唱……！"

        - type: "narration"
          text: "没等文学社学姐说完，百璃就拉着我奔向声源。她总是这样，像永远充不满电的太阳能兔子，活力四射..."

        - type: "command"
          cmd: "character"
          action: "hide"
          param: "白百璃"

        - type: "command"
          cmd: "bg"
          action: "change"
          param: "src/image/background/教学楼-外-2.jpg"

        - type: "dialogue"
          speaker: "S1"
          text: "你们之中若是有外星人、未来人、异世界人、超能力者的话，就尽管来找我吧。"

        - type: "dialogue"
          speaker: "S1"
          text: "？你问要做什么？问这种问题可是要罚金啊！罚金！"

        - type: "dialogue"
          speaker: "S1"
          text: "当然是成立SOS团了"

        - type: "command"
          cmd: "character"
          action: "hide"
          param: "凉宫春日"

        - type: "narration"
          text: "……"

        - type: "dialogue"
          speaker: "S2"
          text: "各位同学 学院偶像了解一下 学院偶像了解一下"

        - type: "dialogue"
          speaker: "S2"
          text: "可可想和大家一起成为学院偶像"

        - type: "dialogue"
          speaker: "S2"
          text: "一起来大展拳脚吧！！"

        - type: "dialogue"
          speaker: "S2"
          text: "一起来做学院偶像吧！！！！！！！"

        - type: "narration"
          text: "……"

        - type: "command"
          cmd: "character"
          action: "hide"
          param: "唐可可"

        - type: "narration"
          text: "在这片喧嚣中，我的目光被一个奇特的摊位吸引——"

        - type: "narration"
          text: "一位蓝发少女正在白板上写满复杂的数学公式，标题赫然是《论⑨在数论中的特殊地位》"

        - type: "narration"
          text: "听围观同学议论，这是一位叫琪露诺（Cirno）的教授，一位日本数学家。毕业于克莱登大学，美国科学院外籍院士，欧洲数学科学院院士、日本政府数学勋章获得者。"

        - type: "narration"
          text: "曾任东京大学数学系教授，北京大学数院访问学者，2099年获诺贝尔数学奖，因其对一位正整数极大值的数论性质的研究被授予菲尔兹奖。"

        - type: "narration"
          text: "正当我犹豫要不要凑热闹时，百璃已经拽着我转向计算机类社团区域"

        - type: "narration"
          text: "……"

        - type: "narration"
          text: "程序设计竞赛协会前人头攒动，而隔壁'网络安全协会'的摊位却冷清得诡异——"

        - type: "dialogue"
          speaker: "G1"
          text: "啊嘞？这里的工作人员集体失踪了吗？"

        - type: "narration"
          text: "正当我们疑惑时，背后突然传来空间扭曲般的波动..."

        - type: "narration"
          text: "突然，一阵旋风掠过，一个黑影以忍者般的姿态从天而降！"

        - type: "dialogue"
          speaker: "B10"
          displayname: "???"
          text: "へんへん～！迷途的羔羊们啊，可愿与吾辈共赴CTF的修罗场？"

        - type: "narration"
          text: "我和百璃被这突如其来的登场吓得后退半步，只见来人单膝跪地，披风（其实是实验室白大褂）在风中猎猎作响"

        - type: "dialogue"
          speaker: "B10"
          displayname: "???"
          text: "Kukuku...被在下的瞬身之术震撼到了吗？"

        - type: "narration"
          text: "面前这位戴着反光眼镜的学长摆出中二的pose，镜片闪过一道白光"

        - type: "dialogue"
          speaker: "A1"
          text: "啊，那个..."

        - type: "dialogue"
          speaker: "B10"
          text: "失礼了！在下乃网络安全协会至高统帅，代号'秋雨样大人'！"

        - type: "dialogue"
          speaker: "B10"
          text: "作为你们的直系前辈，特此邀请二位加入吾等的'暗夜黑客团'！"

        - type: "dialogue"
          speaker: "B10"
          text: "CTF的世界正在召唤新的勇者！保证不会让你们像在红魔馆修电脑时那样坐牢！"

        - type: "dialogue"
          speaker: "G1"
          text: "坐...坐牢？"

        - type: "dialogue"
          speaker: "B10"
          text: "啊哈哈，那是后日谈的内容了～"

        - type: "dialogue"
          speaker: "A1"
          text: "所以CTF到底是什么啊？"

        - type: "dialogue"
          speaker: "B10"
          text: "纳尼？！竟然不知道CTF？！"

        - type: "dialogue"
          speaker: "B10"
          text: "听好了！这是吾等黑客的圣战！在网络空间的战场上夺取Flag的荣耀之战！"

        - type: "dialogue"
          speaker: "B10"
          text: "Web、Pwn、Re、Misc...每道关卡都是对智慧的试炼！"

        - type: "narration"
          text: "显然，我和百璃都还是一头雾水"

        - type: "dialogue"
          speaker: "B10"
          text: "哼...看来需要实战教学呢！"

        - type: "narration"
          text: "会长突然摆出结印手势，大喝一声'通灵之术！'，从背包里召唤出一台贴满动漫贴纸的笔记本电脑"

        - type: "narration"
          text: "开机画面是某个举着机枪的蓝发少女...算了这不重要"

        - type: "dialogue"
          speaker: "B10"
          text: "看好了！这是新手试炼之门！"

        - type: "narration"
          text: "屏幕上赫然显示着一个登录框，上方用血色字体写着「SQL ME!」"

        - type: "dialogue"
          speaker: "B10"
          text: "让吾看看你的器量吧，少年！"

        - type: "narration"
          text: "我试着输入了 admin'or 1=1# ，密码随便填了个1"

        - type: "narration"
          text: "页面突然炸开烟花特效，跳出一行炫彩文字：flag{Ciallo～(∠・ω< )⌒☆}"

        - type: "dialogue"
          speaker: "B10"
          text: "哦哦哦！这就是觉醒的时刻！"

        - type: "narration"
          text: "会长突然抓住我的双手，眼镜反射出诡异的光芒"

        - type: "dialogue"
          speaker: "B10"
          text: "少年！你体内沉睡着黑客之魂！加入吾等吧！这是命运石之门的选择！"

        - type: "dialogue"
          speaker: "A1"
          text: "等等我还没..."

        - type: "dialogue"
          speaker: "B10"
          text: "无需多言！能破解此术式说明你已具备资质！学号速速报来！(๑•̀ㅂ•́)و✧"

        - type: "narration"
          text: "就在我不知所措时，百璃的眼睛突然开始闪闪发光"

        - type: "dialogue"
          speaker: "G1"
          text: "教练！我也要成为黑客！o(*≧▽≦)ツ┏━┓"

        - type: "dialogue"
          speaker: "B10"
          text: "很好！新的战力加入了！"

        - type: "dialogue"
          speaker: "A1"
          text: "？？？百璃你怎么也？"

        - type: "dialogue"
          speaker: "G1"
          text: "虽然完全不懂，但是超——级酷啊！我们一起当CTFer吧！"

        - type: "dialogue"
          speaker: "B10"
          text: "哼...CTF之路布满荆棘，但正因如此才显得荣耀！"

        - type: "dialogue"
          speaker: "B10"
          text: "不过放心，在下的黑客道场会让你们脱胎换骨！"

        - type: "narration"
          text: "会长45度角仰望天空，白大褂无风自动"

        - type: "dialogue"
          speaker: "B10"
          text: "若不尽快招到新人，协会就要面临『废部危机』了...这一定是Dark Flame Master的阴谋！"

        - type: "dialogue"
          speaker: "B10"
          text: "さあ、与吾等缔结契约吧！"

        - type: "dialogue"
          speaker: "B10"
          text: "Waku waku～☆"

        - type: "narration"
          text: "就这样，我们莫名其妙地成为了网络安全协会的新成员"

        - type: "command"
          cmd: "bg"
          action: "title"
          param: "未完待续"
